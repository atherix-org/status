<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atherix Status</title>
<link rel="icon" href="https://atherix.org/favicon.ico">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#737373;--card:#fff;--bd:#e5e5e5;--up:#16a34a;--deg:#d97706;--down:#dc2626;--none:#e5e5e5;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#fafafa;--mut:#a3a3a3;--card:#171717;--bd:#ffffff1a;--up:#22c55e;--deg:#f59e0b;--down:#ef4444;--none:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:2.5rem 1rem 4rem}
header{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem}
header img{width:36px;height:36px;object-fit:contain}
h1{font-size:1.4rem;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.85rem}
.banner{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);font-weight:600;margin-bottom:1.5rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.up{--c:var(--up)}.deg{--c:var(--deg)}.down{--c:var(--down)}
.banner.up .dot,.banner.deg .dot,.banner.down .dot{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:10px;margin-bottom:1rem}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-size:.85rem;padding:.3rem .8rem;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.card{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);padding:1.1rem 1.25rem;margin-bottom:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem}
.name{font-weight:600}
.pill{font-size:.75rem;font-weight:600;padding:.15rem .6rem;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bars{display:flex;gap:2px;height:34px}
.bars i{flex:1;border-radius:3px;background:var(--none)}
.bars i.up{background:var(--up)}.bars i.deg{background:var(--deg)}.bars i.down{background:var(--down)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.8rem;margin-top:.6rem}
.foot{color:var(--mut);font-size:.8rem;text-align:center;margin-top:2rem}
</style>
</head>
<body>
<main>
<header><img src="https://atherix.org/logo.png" alt=""><div><h1>Atherix Status</h1><div class="sub" id="upd">Loading…</div></div></header>
<div class="banner" id="banner"><span class="dot"></span><span id="btxt">Checking services…</span></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<p class="foot">Checks run every 5 minutes.</p>
</main>
<script>
const RAW="https://raw.githubusercontent.com/atherix-org/status/master/data/history.json";
const RANGES={"24h":[864e5,48],"7d":[6048e5,56],"30d":[2592e6,30]};
const CLS=["up","deg","down"], LBL=["Operational","Degraded","Down"];
let db=null, range="24h";
const $=id=>document.getElementById(id);

async function load(){
  for(const u of [RAW+"?t="+Date.now(),"data/history.json?t="+Date.now()]){
    try{const r=await fetch(u);if(r.ok){db=await r.json();return}}catch{}
  }
}
function render(){
  const [span,n]=RANGES[range], now=Date.now(), size=span/n, list=$("list");
  list.innerHTML=""; let worst=0, any=false, last=0;
  for(const m of Object.values(db.monitors)){
    const all=m.checks, cur=all.length?all[all.length-1]:null;
    if(cur){any=true;worst=Math.max(worst,cur[1]);last=Math.max(last,cur[0])}
    const win=all.filter(c=>c[0]>=now-span), b=Array(n).fill(-1);
    for(const c of win){const i=Math.min(n-1,Math.floor((c[0]-(now-span))/size));b[i]=Math.max(b[i],c[1])}
    const up=win.filter(c=>c[1]===0).length;
    const pct=win.length?(up/win.length*100).toFixed(2)+"%":"—";
    const ms=win.length?Math.round(win.reduce((a,c)=>a+c[2],0)/win.length)+" ms":"—";
    const s=cur?cur[1]:-1;
    const el=document.createElement("div");el.className="card";
    el.innerHTML=`<div class="top"><span class="name"></span><span class="pill ${CLS[s]||""}">${LBL[s]||"No data"}</span></div>
      <div class="bars">${b.map(v=>`<i class="${CLS[v]||""}"></i>`).join("")}</div>
      <div class="meta"><span>${pct} uptime</span><span>${ms} avg response</span></div>`;
    el.querySelector(".name").textContent=m.name;
    list.append(el);
  }
  const bn=$("banner");
  bn.className="banner "+(any?CLS[worst]:"");
  $("btxt").textContent=!any?"No data yet":["All systems operational","Some systems are degraded","Services are down"][worst];
  $("upd").textContent=last?"Updated "+new Date(last).toLocaleString():"Waiting for the first check";
}
$("tabs").innerHTML=Object.keys(RANGES).map(k=>`<button data-r="${k}" aria-pressed="${k===range}">${k}</button>`).join("");
$("tabs").onclick=e=>{const k=e.target.dataset.r;if(!k||!db)return;range=k;
  [...$("tabs").children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.r===k));render()};
load().then(()=>db?render():($("btxt").textContent="Could not load status data"));
</script>
</body>
</html>
